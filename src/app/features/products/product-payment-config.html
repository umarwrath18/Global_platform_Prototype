@if (view(); as v) {
  <div class="ppc">
    <div class="ppc-notice" [class.warn]="v.suspended" role="note">
      <app-icon name="info" [size]="16" />
      <div>{{ v.notice }}</div>
    </div>

    <app-products-card [view]="v" [locked]="editorOpen()" (saved)="onChanged($event)" (dirtyChange)="productsDirty.set($event)" />
    <app-pricing-panel [view]="v" [productsDirty]="productsDirty()" (changed)="onChanged($event)" (editing)="editorOpen.set($event)" />

    @if (toast(); as t) {
      <div class="p-toast" role="status"><app-icon name="check-circle" [size]="18" />{{ t }}</div>
    }
  </div>
} @else if (error(); as e) {
  <div class="alert danger compact" role="alert"><app-icon name="alert-circle" /><div>{{ e.message ?? "We couldn't load products and pricing." }} <button type="button" class="btn sm" (click)="load()">Try again</button></div></div>
} @else {
  <div class="skeleton-rows" aria-busy="true" aria-label="Loading products and pricing"><span></span><span></span></div>
}
